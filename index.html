<!doctype html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/saphiro-inmobiliaria-logo-mini.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inmobiliaria-dashboard</title>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="datepicker-portal" style="position: relative; z-index: 45"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
